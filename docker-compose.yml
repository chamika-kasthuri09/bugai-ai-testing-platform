services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["127.0.0.1:8000:8000"]
    environment:
      BUGAI_MODE: local
    networks: [control]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: [CMD, .venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:5173:5173"]
    networks: [control]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  demo:
    image: python:3.12-slim
    command: [python, -m, http.server, "8080", --bind, "0.0.0.0", --directory, /fixture]
    user: "10001"
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./tests/fixture:/fixture:ro"]
    networks: [fixture]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  postgres:
    image: postgres:17
    profiles: [data]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bugai}
      POSTGRES_USER: ${POSTGRES_USER:-bugai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    networks: [control]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 5
  redis:
    image: redis:7.4
    profiles: [data]
    command: [redis-server, --save, "", --appendonly, "no"]
    networks: [control]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5
networks:
  control:
    internal: true
  fixture:
    internal: true
volumes:
  postgres-data:
