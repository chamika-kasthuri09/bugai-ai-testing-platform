<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><title>BugAI controlled fixture</title></head>
  <body>
    <h1>Controlled fixture</h1>
    <a href="/">Home</a>
    <a href="/missing">Deliberately broken link</a>
    <form id="signup" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required maxlength="80">
      <label for="age">Age</label>
      <input id="age" name="age" type="number" min="18" max="120" value="18">
      <button type="submit">Submit</button>
      <p id="signup-status" role="status" aria-live="polite"></p>
    </form>
    <script>
      document.querySelector("form").addEventListener("submit", (event) => {
        event.preventDefault();
        const email = document.querySelector("#email");
        const age = Number(document.querySelector("#age").value);
        // Known defect: age 18 is incorrectly rejected; documented in benchmark.json.
        document.querySelector("[role=status]").textContent = !email.value
          ? "Email is required"
          : !email.validity.valid ? "Email is invalid"
          : age <= 18 || age > 120 ? "Age must be between 18 and 120"
          : "Submitted";
      });
    </script>
  </body>
</html>
